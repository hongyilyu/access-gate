[package]
name = "access-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hongyilyu/access-gate"
publish = false
description = "Checks Cloudflare Access's JWT again in the app behind it, and gates an admin page on it."

[dependencies]
# The request's method and headers, and the refusal's status: the types axum 0.8 re-exports.
http = "1.5.0"
# Exactly one crypto provider, or the first verification panics. aws-lc-rs is the backend
# reqwest's rustls already uses; no PEM keys, since the team's keys arrive as a JWKS.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
# Fetches the team's keys, and nothing else.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = "1.0.229"
thiserror = "2.0.21"
# `Mutex`, held across a key fetch, the task each fetch runs on, and the monotonic clock the key
# cache reads.
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
# `test-util` for tokio::time::pause, so the key-cache tests move the cache's clock.
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
# A fake keys endpoint on 127.0.0.1, so the key-cache tests run real fetches.
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
